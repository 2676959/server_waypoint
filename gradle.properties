# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.configureondemand=true

# NeoGradle: do not auto-create a run per SDK run type; runs are declared explicitly
# in mods/neogradle.gradle.kts. This also stops NeoGradle's task rule from inventing
# phantom runs (and failing configuration) when an unknown `run<X>` task is requested.
neogradle.subsystems.conventions.runs.create-default-run-per-type=false

