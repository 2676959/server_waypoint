name: ServerWaypoint
version: '${version}'
main: _959.server_waypoint.ServerWaypointPaperMC
api-version: '${mcVersion}'
folia-supported: true
author: 2676959
description: Shared waypoints, navigation and teleportation through commands and clickable chat, no client mod required. The optional client mod adds a GUI waypoint manager, in-world waypoints HUD rendering and automatic syncing to supported map mods.
website: https://modrinth.com/plugin/server_waypoint
prefix: server_waypoint_plugin

dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true

# Leave nodes unset by default so CommandPermission levels remain reloadable.
permissions:
  server_waypoint.command.private.list:
    description: Browse your private waypoints
    default: false
  server_waypoint.command.private.add:
    description: Create and restore your private waypoints
    default: false
  server_waypoint.command.private.edit:
    description: Edit your private waypoints
    default: false
  server_waypoint.command.private.remove:
    description: Remove your private waypoints
    default: false
  server_waypoint.command.private.navigate:
    description: Navigate to your private waypoints
    default: false
  server_waypoint.command.private.tp:
    description: Teleport to your private waypoints
    default: false
