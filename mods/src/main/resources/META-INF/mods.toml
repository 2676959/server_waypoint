modLoader = "javafml"
loaderVersion = "${forge_dependency}"
license = "MIT"
issueTrackerURL = "https://github.com/2676959/server_waypoint/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "2676959"
description = "${description}"
displayURL = "https://modrinth.com/plugin/server_waypoint"
logoFile = "assets/server_waypoint/icon.png"
logoBlur = false
displayTest = "IGNORE_SERVER_VERSION"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_dependency}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "xaerominimap"
mandatory = false
versionRange = "[25.2.6,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.${id}]]
modId = "xaeroworldmap"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
<% if (voxelmap) { %>
[[dependencies.${id}]]
modId = "voxelmap"
mandatory = false
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"
<% } %>
[[mixins]]
config = "server_waypoint-common.mixins.json"
<% if (voxelmap) { %>
[[mixins]]
config = "server_waypoint-voxelmap.mixins.json"
<% } %>
